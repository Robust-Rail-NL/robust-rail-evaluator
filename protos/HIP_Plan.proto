syntax = "proto3";

package HIP_protos;
import "HIP_Common.proto";
import "HIP_Scenario.proto";

// An origin's own verdict on whether its submitted Plan satisfies all hard
// constraints - not a claim about whether some other plan for the same
// Scenario might exist. Unknown is 0 (the proto3 default for an unset
// field), so an absent value and an explicit "Unknown" are indistinguishable
// on the wire - matching the schema's own default for an origin that
// doesn't compute this, or a plan predating this field.
enum Feasibility {
	Unknown = 0;
	Feasible = 1;
	Infeasible = 2;
}

// This message contains the result of a shunting algorithm.
message Plan {
	// The shared interchange schema version. Present as an explicit-presence
	// field so readers can distinguish "absent" from "sent as 0".
	optional int32 schemaVersion = 3;

	repeated Action actions = 1;

	// A list of all TrackParts. From this a rail graph can be constructed.
	// This field should be temporary and be replaced as soon as we send input to the algorithm.
	// Field 2 was trackParts, a copy of the location's track graph carried in
	// the plan because the evaluator supposedly could not reach the original.
	// It receives --path_location directly, and never read this.
	reserved 2;

	Feasibility feasibility = 4;

	// Free text identifying what produced this plan, e.g.
	// "robust-rail-solver 2.0.0-edge+20260826.a1b2c3d" - for a human
	// debugging a failed evaluation, not for programmatic parsing.
	optional string origin = 5;

	// The origin's own total objective/cost value for this plan, in
	// whatever units and scale that origin uses - not comparable across
	// different origins.
	optional double cost = 6;

	// Free-form human-readable breakdown of cost, e.g. the solver's own
	// SolutionCost.ToString() output. Not structured: the term breakdown is
	// origin-specific and isn't a general interchange concept the way the
	// total itself is.
	optional string costDetails = 7;
}

message Action {
	// The time interval of this action.
	// Times are in seconds since the epoch.
	uint64 startTime = 1;
	uint64 endTime = 2;

	// The type of this action (e.g. cleaning, moving, waiting)
	TaskType taskType = 3;

	// The ShuntingUnit to which this Action applies
	ShuntingUnit shuntingUnit = 4;

	// The TrackPart ID on which this Action occurs.
	// If taskType = Move, then trackPart specifies the move destination,
	// and the resources specify the path.
	uint64 location = 5;

	// Other resources besides the TrackPart involved with the Action.
	// For example for taskType = InternalCleaning there could be
	// a CleaningPlatform Facility Resource.
	repeated Resource resources = 6;

    // Field 7 was trainUnitIds, for naming a subset of the shunting unit's
    // members. Nothing ever wrote it and nothing read it here, so it was
    // removed; the members of the shunting unit are the units involved.
    reserved 7;
}